<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Macrosia Web Demo</title>
    <link rel="icon" type="image/x-icon" href="https://balt.sno.mba/macroscript/favicon.ico">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.2/ace.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap');
      div.split {
        display: grid;
        grid-template: 1fr / 1fr 1fr;
      }
      div.vsplit {
        position: absolute;
        left: 0; top: 0;
        width: 100vw;
        height: 100vh;
        display: grid;
        grid-template: 1fr 50pt / 1fr;
      }
      textarea#output {
        font-family: JetBrains Mono;
        font-size: 16pt;
        background-color: #181020;
        color: #ffffff;
        border: 3pt solid #ffffff20;
        border-radius: 6pt;
        margin: 6pt;
        resize: none;
        cursor: text;
        padding: 6pt;
      }
      button#run {
        border: none;
        font-family: "JetBrains Mono";
        font-size: 16pt;
        background-color: #ffffff20;
        color: #ffffff;
        margin: 6pt 12pt;
        border-radius: 6pt;
        cursor: pointer;
        transition: background-color 0.05s ease-in-out;
      }
      button#run:hover {
        background-color: #ffffff40;
      }
      button#run:active {
        background-color: #ffffff10;
      }
      button#run.stop {
        background-color: #ff4040;
      }
      button#run.stop:hover {
        background-color: #ff8080;
      }
      button#run.stop:active {
        background-color: #ff2020;
      }
      body {
        background-color: #000000;
        color: #ffffff;
      }
      a.doclink {
        transition: background-color 0.05s ease-in-out;
        background-color: #201428;
        border: none;
        width: auto;
        height: auto;
        display: inline-block;
        font-family: JetBrains Mono;
        border-radius: 6pt;
        margin: 6pt 12pt;
        font-size: 16pt;
        text-align: center;
        text-decoration: none;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #9090ff;
      }
      a.doclink:hover {
        text-decoration: underline;
        background-color: #281830;
      }
      a.doclink:active {
        background-color: #100A14;
      }
      a.doclink:visited {
        color: #ff70ff;
      }
      * {
        box-sizing: border-box;
      }
      div#editor {
        margin: 6pt;
        border-radius: 6pt;
        padding: 6pt;
      }
      .ace_variable.ace_language {
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="vsplit">
      <div class="split">
        <div id="editor">#define infinite_loop [infinite_loop]
[infinite_loop]</div>
        <textarea readonly disabled id="output"></textarea>
      </div>
      <div class="split">
        <button id="run">Run</button>
        <a class="doclink" href="./doc/index.html">Documentation</a>
      </div>
    </div>
    <script type="module">
      import init, { evaluate, get_stdlib_macro_names, cancel_running_macro } from "./pkg/glue.js";
      const out = document.getElementById("output"); // global
      var wasmInitialized = false; // global
      var editor; // global
      out.value = "Initializing...";
      let running = false;
      init().then(() => {
        wasmInitialized = true;

        let macro_names = [];
        for (let name of get_stdlib_macro_names()) {
          macro_names.push(RegExp.escape(name));
        }

        ace.define('ace/mode/macrosia', ['require', 'exports', 'module'],
          function(require, exports, module) {
            "use strict";

            let oop = require("ace/lib/oop");
            let TextMode = require("ace/mode/text").Mode;
            let Tokenizer = require("ace/tokenizer").Tokenizer;
            let CstyleBehaviour = require("ace/mode/behaviour/cstyle").CstyleBehaviour;
            let TextHighlightRules = require("ace/mode/text_highlight_rules").TextHighlightRules;
            let BaseMode = require("ace/mode/folding/fold_mode").FoldMode;
            let Range = require("ace/range").Range;
            let TokenIterator = require("ace/token_iterator").TokenIterator;

            let FoldMode = function() {};

            oop.inherits(FoldMode, BaseMode);

            (function() {
                this.foldingStartMarker = /(?<!\\)(?:\\\\)*\[/;
                this.foldingStopMarker = /(?<!\\)(?:\\\\)*\]/;
            }).call(BaseMode.prototype);

            let MacrosiaHighlight = function() {
                this.$rules = {
                    "start": [
                        {
                          token: "keyword",
                          regex: /^#define/,
                          next: "macro_name"
                        },
                        {
                          token: "string",
                          regex: /\\/,
                          next: "escaped"
                        },
                        {
                          token: "keyword.operator",
                          regex: /[\[\]]/,
                        },
                        {
                          token: "keyword.control",
                          regex: /\//
                        },
                        {
                          token: "storage.type",
                          regex: `(?<=\\[)(?:${macro_names.join("|")})(?=[\\/\\]])`
                        },
                        {
                          token: "variable.language",
                          regex: /\$(-?\d+|#|!)/
                        },
                        {
                          token: "string",
                          regex: /\$(?!-?\d+|#|!)/
                        },
                        {
                          token: "variable.parameter",
                          regex: /(?<=\[)(?:[^\[\]/\\\$]+)(?=[\/\]])/
                        },
                        {
                          token: "constant.numeric",
                          regex: /(?<=[\[\/])[-+]?(?:(?:0b[01]+|0x[0-9A-Fa-f]+|0o[0-7]+|(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?|inf|nan|NaN)j?|(?:0b[01]+|0x[0-9A-Fa-f]+|0o[0-7]+|(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?|inf|nan|NaN)[+-](?:0b[01]+|0x[0-9A-Fa-f]+|0o[0-7]+|(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?|inf|nan|NaN)j)(?=[\/\]])/
                        },
                        {
                          token: "string",
                          regex: /[^\[\]\/\\\$]+/
                        },
                    ],
                    "escaped": [
                      {
                        token: "string",
                        regex: ".",
                        next: "start"
                      }
                    ],
                    "macro_name": [
                      {
                        token: "variable.parameter",
                        regex: /\s+[^\s]+/,
                        next: "start"
                      }
                    ],
                };
            };

            oop.inherits(MacrosiaHighlight, TextHighlightRules);

            let Mode = function() {
                this.$tokenizer = new Tokenizer(new MacrosiaHighlight().$rules);
                this.$behaviour = new CstyleBehaviour({ braces: true });
                this.foldingRules = new FoldMode();
            };

            oop.inherits(Mode, TextMode);

            (function() {
                this.$id = "ace/mode/macrosia";
            }).call(Mode.prototype);

            exports.Mode = Mode;
            out.value = "";
        });

        editor = ace.edit("editor");
        editor.setTheme("ace/theme/monokai");
        editor.session.setMode("ace/mode/, _r, _a");
        editor.setBehavioursEnabled(true);
        editor.setOptions({
          fontFamily: "JetBrains Mono",
          fontSize: "16px",
        });

        const button = document.getElementById("run");
        button.addEventListener('mousedown', () => {
          if (!wasmInitialized || !editor) {
            out.value = "Macrosia not initialized yet, wait a second.";
            return;
          }
          if (running) {
            cancel_running_macro();
            return;
          }
          out.value = "Running...";
          button.classList.add('stop');
          button.textContent = "Stop";
          running = true;
          evaluate(editor.getValue()).then((res) => {
            out.value = res;
          }).catch((e) => {
            out.value = `[JAVASCRIPT ERROR]\n${e}`
          }).finally(() => {
            button.classList.remove('stop');
            button.textContent = "Run";
            running = false;
          });
        });
      });
    </script>
  </body>
</html>
